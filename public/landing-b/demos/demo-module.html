<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>TerminalSync · Demo interactivo</title>
  <style>
    :root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#20212a;background:#f8f8fb;font-synthesis:none;text-rendering:optimizeLegibility}
    *{box-sizing:border-box}body{margin:0;padding:clamp(12px,3vw,28px);background:linear-gradient(145deg,#faf9ff,#f5f7fa 70%);min-height:100vh}
    .shell{width:min(100%,1020px);margin:0 auto;border:1px solid #e5e5ed;border-radius:18px;background:#fff;box-shadow:0 18px 50px -36px rgba(32,25,70,.35);overflow:hidden}
    .top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:15px 19px;border-bottom:1px solid #ededf2}
    .brand{display:flex;align-items:center;gap:11px;min-width:0}.monogram{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:#6a48e8;color:#fff;font-size:13px;font-weight:750;letter-spacing:-.04em}
    .brand strong{display:block;font-size:13px}.brand small{display:block;margin-top:2px;color:#81818d;font-size:11px}
    .status{display:inline-flex;align-items:center;gap:7px;padding:7px 10px;border:1px solid #e8e5f6;border-radius:999px;background:#faf9ff;color:#5839c7;font-size:10px;font-weight:650;white-space:nowrap}.dot{width:7px;height:7px;border-radius:50%;background:#8368ef}
    main{padding:clamp(18px,4vw,34px)}.eyebrow{font:600 10px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.15em;text-transform:uppercase;color:#7259d4}
    h1{margin:10px 0 9px;max-width:24ch;font-size:clamp(22px,3.8vw,36px);line-height:1.1;letter-spacing:-.045em;font-weight:650} .intro{margin:0;max-width:75ch;color:#646573;font-size:13px;line-height:1.6}
    .workspace{margin-top:22px;border:1px solid #e9e9ef;border-radius:14px;background:#fbfbfd;overflow:hidden}.toolbar{display:flex;align-items:center;gap:7px;padding:10px 13px;border-bottom:1px solid #ececf1;background:#fff}.traffic{display:flex;gap:4px}.traffic i{width:7px;height:7px;border-radius:50%;background:#e4e1eb}.toolbar-label{margin-left:6px;color:#777887;font-size:10px}.body{padding:16px;display:grid;gap:12px}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,205px),1fr));gap:10px}.card{padding:13px;border:1px solid #e8e8ef;border-radius:11px;background:#fff;min-width:0}.card b{display:block;font-size:12px}.card p{margin:6px 0 0;color:#747582;font-size:11px;line-height:1.5}
    .row{display:flex;align-items:center;gap:9px;padding:10px 11px;border:1px solid #e9e9ef;border-radius:10px;background:#fff;font-size:11px}.row span:last-child{margin-left:auto;color:#7660ca;font-size:10px}.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border-radius:999px;background:#f0edff;color:#5939c8;font-size:9px;font-weight:700}
    .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.button{appearance:none;border:1px solid #ddd8f5;border-radius:9px;background:#6a48e8;color:#fff;padding:9px 12px;font:inherit;font-size:11px;font-weight:600;line-height:1.2;cursor:pointer}.button.secondary{background:#fff;color:#57439d;border-color:#e4e1ef}.button:hover{filter:brightness(.97)}
    .message{display:none;padding:10px 12px;border:1px solid #dcd5f7;border-radius:9px;background:#f7f5ff;color:#4f37a7;font-size:11px;line-height:1.5}.message.show{display:block}
    .quote{display:none;grid-template-columns:1fr auto;gap:5px 18px;padding:12px;border:1px solid #e8e4f8;border-radius:10px;background:#faf9ff;font-size:11px}.quote.show{display:grid}.quote span{color:#777887}.quote strong{color:#4c36a7;text-align:right}.fine{margin:14px 0 0;color:#858592;font-size:10px;line-height:1.5}
    @media(max-width:560px){.top{align-items:flex-start}.status{white-space:normal}.body{padding:12px}.row{align-items:flex-start}.button{flex:1}}
  </style>
</head>
<body>
  <div class="shell">
    <header class="top">
      <div class="brand"><span class="monogram" aria-hidden="true">TS</span><div><strong>TerminalSync</strong><small id="workspaceLabel">Demo de producto</small></div></div>
      <span class="status"><i class="dot" aria-hidden="true"></i><span id="statusText">Simulación interactiva</span></span>
    </header>
    <main>
      <div class="eyebrow" id="eyebrow"></div>
      <h1 id="title"></h1>
      <p class="intro" id="intro"></p>
      <section class="workspace" aria-label="Product demo">
        <div class="toolbar"><span class="traffic" aria-hidden="true"><i></i><i></i><i></i></span><span class="toolbar-label" id="toolbarLabel"></span></div>
        <div class="body" id="demoBody"></div>
      </section>
      <p class="fine" id="disclaimer"></p>
    </main>
  </div>
  <script>
    (function(){
      const copy={
        es:{
          common:{workspace:'Demo de producto',demoLabel:'Demostración de producto',status:'Simulación interactiva',disclaimer:'Demostración ilustrativa: no se contacta a nadie, no se publican anuncios, no se genera contenido de pago y no se mueve dinero.'},
          prospecting:{eyebrow:'Motor de prospección de TerminalSync',title:'Encuentra oportunidades mientras conversas.',intro:'Describe el perfil de cliente que buscas. TerminalSync reúne señales públicas y organiza posibles contactos para que revises el siguiente paso.',toolbar:'Búsqueda · servicios locales',action:'Buscar oportunidades de muestra',result:'3 negocios con señales recientes',cards:[['Clínica del Parque','Bogotá · Salud · contratación reciente'],['Casa Nativa','Medellín · Hogar · nuevo punto de venta'],['Taller Norte','Cali · Servicios · opiniones recientes']],done:'Resultados de demostración listos. Revisa cada dato antes de contactar.'},
          browser:{eyebrow:'Navegador privado integrado',title:'Una ventana aislada para cada workspace.',intro:'Abre una página dentro del espacio correcto, conserva la separación entre proyectos y guarda lo útil como contexto.',toolbar:'Proyecto Norte · ventana privada',action:'Guardar esta página en Contexto',row:'proveedor.example/catalogo',done:'Página guardada como contexto de Proyecto Norte. La ventana principal no cambia.'},
          creative:{eyebrow:'Estudio creativo · cotización previa',title:'Ve el proveedor y el precio antes de crear.',intro:'Pide un ajuste para una imagen o un clip. Esta demo muestra una cotización ilustrativa y espera tu decisión; no genera ni cobra nada.',toolbar:'Mis diseños · nueva solicitud',action:'Ver cotización de muestra',confirm:'Confirmar en esta demo',quoteLabel:'Cotización ilustrativa · no es un precio real',provider:'Proveedor de muestra',price:'USD $1.24',state:'Sin generar ni cobrar',done:'La cotización está visible. En un flujo real, confirmas el precio exacto antes de generar.'},
          ads:{eyebrow:'Meta Ads · aprobación humana',title:'La campaña queda en pausa hasta tu OK.',intro:'Revisa presupuesto, audiencia y contenido antes de publicar. La acción permanece pausada y no se gasta dinero en esta demostración.',toolbar:'Campaña de muestra · Meta Ads',action:'Revisar detalles de aprobación',campaign:'Mensajes · Bogotá · 14 días',budget:'Presupuesto de muestra: $40.000 COP / día',paused:'Preparada y en pausa · no publicada',done:'La revisión está abierta. No se publicó ningún anuncio ni se gastó dinero.'},
          accounting:{eyebrow:'TerminalSync Contabilidad',title:'Cada movimiento tiene su contrapartida.',intro:'Revisa una conciliación ilustrativa con partida doble. Las reglas sugieren coincidencias; el dueño aprueba antes de registrar.',toolbar:'Conciliación bancaria · demostración',action:'Preparar conciliación de muestra',invoice:'Factura de proveedor',inventory:'Inventario recibido',entry:'Asiento balanceado',debit:'Débito',credit:'Crédito',match:'Coincidencia sugerida',done:'3 coincidencias sugeridas. La conciliación espera aprobación del dueño; no se movió dinero.'}
        },
        en:{
          common:{workspace:'Product demo',demoLabel:'Product demo',status:'Interactive simulation',disclaimer:'Illustrative demo: no one is contacted, no ads are published, no paid content is generated, and no money is moved.'},
          prospecting:{eyebrow:'TerminalSync Prospecting Engine',title:'Find opportunities while you chat.',intro:'Describe the customer profile you want. TerminalSync gathers public signals and organizes potential contacts so you can review the next step.',toolbar:'Search · local services',action:'Find sample opportunities',result:'3 businesses with recent signals',cards:[['Parkside Clinic','Bogotá · Healthcare · recent hiring'],['Casa Nativa','Medellín · Home · new location'],['North Workshop','Cali · Services · recent reviews']],done:'Sample results are ready. Review each detail before reaching out.'},
          browser:{eyebrow:'Built-in private browser',title:'An isolated window for every workspace.',intro:'Open a page inside the right workspace, keep projects separate, and save useful pages as context.',toolbar:'Project North · private window',action:'Save this page to Context',row:'vendor.example/catalog',done:'Page saved as Project North context. Your main browser remains unchanged.'},
          creative:{eyebrow:'Creative studio · upfront quote',title:'See the provider and price before you create.',intro:'Request an edit to an image or clip. This demo shows an illustrative quote and waits for your decision; nothing is generated or billed.',toolbar:'My Designs · new request',action:'Show sample quote',confirm:'Confirm in this demo',quoteLabel:'Illustrative quote · not a real price',provider:'Sample provider',price:'USD $1.24',state:'Not generated or billed',done:'The quote is visible. In a live flow, you confirm the exact price before generating.'},
          ads:{eyebrow:'Meta Ads · human approval',title:'The campaign stays paused until your OK.',intro:'Review the budget, audience, and content before publishing. This action remains paused and spends nothing in this demo.',toolbar:'Sample campaign · Meta Ads',action:'Review approval details',campaign:'Messages · Bogotá · 14 days',budget:'Sample budget: COP 40,000 / day',paused:'Prepared and paused · not published',done:'Review details are open. No ad was published and no money was spent.'},
          accounting:{eyebrow:'TerminalSync Accounting',title:'Every transaction has its counterpart.',intro:'Review an illustrative double-entry reconciliation. Rules suggest matches; the owner approves before anything is recorded.',toolbar:'Bank reconciliation · demo',action:'Prepare sample reconciliation',invoice:'Vendor invoice',inventory:'Inventory received',entry:'Balanced entry',debit:'Debit',credit:'Credit',match:'Suggested match',done:'3 suggested matches. Reconciliation is waiting for owner approval; no money was moved.'}
        }
      };
      const params=new URLSearchParams(location.search);
      const locale=params.get('lang')==='en'?'en':'es';
      const key=params.get('module')||'prospecting';
      const strings=copy[locale][key]||copy[locale].prospecting;
      document.documentElement.lang=locale;
      document.querySelector('.workspace').setAttribute('aria-label',copy[locale].common.demoLabel);
      document.title='TerminalSync · '+strings.title;
      document.getElementById('workspaceLabel').textContent=copy[locale].common.workspace;
      document.getElementById('statusText').textContent=copy[locale].common.status;
      document.getElementById('eyebrow').textContent=strings.eyebrow;
      document.getElementById('title').textContent=strings.title;
      document.getElementById('intro').textContent=strings.intro;
      document.getElementById('toolbarLabel').textContent=strings.toolbar;
      document.getElementById('disclaimer').textContent=copy[locale].common.disclaimer;
      const body=document.getElementById('demoBody');
      const message=document.createElement('div');message.className='message';message.setAttribute('aria-live','polite');
      const button=document.createElement('button');button.type='button';button.className='button';
      const secondary=document.createElement('button');secondary.type='button';secondary.className='button secondary';
      if(key==='prospecting'){
        const grid=document.createElement('div');grid.className='grid';
        strings.cards.forEach(function(item){const card=document.createElement('article');card.className='card';card.innerHTML='<b></b><p></p>';card.querySelector('b').textContent=item[0];card.querySelector('p').textContent=item[1];grid.appendChild(card);});
        const result=document.createElement('div');result.className='pill';result.textContent=strings.result;body.append(grid,result);button.textContent=strings.action;body.append(button,message);button.addEventListener('click',function(){message.textContent=strings.done;message.classList.add('show');});
      }else if(key==='browser'){
        const row=document.createElement('div');row.className='row';row.innerHTML='<strong></strong><span></span>';row.querySelector('strong').textContent='URL';row.querySelector('span').textContent=strings.row;body.append(row);button.textContent=strings.action;body.append(button,message);button.addEventListener('click',function(){message.textContent=strings.done;message.classList.add('show');});
      }else if(key==='creative'){
        const quote=document.createElement('div');quote.className='quote';quote.innerHTML='<span></span><strong></strong><span></span><strong></strong><span></span><strong></strong>';
        const labels=[strings.quoteLabel,strings.provider,strings.state],values=['',strings.price,''];
        quote.querySelectorAll('span').forEach(function(node,i){node.textContent=labels[i];});quote.querySelectorAll('strong').forEach(function(node,i){node.textContent=values[i];});
        button.textContent=strings.action;secondary.textContent=strings.confirm;body.append(quote,button,secondary,message);
        button.addEventListener('click',function(){quote.classList.add('show');message.textContent=strings.done;message.classList.add('show');});
        secondary.addEventListener('click',function(){message.textContent=strings.done;message.classList.add('show');});
      }else if(key==='ads'){
        const row=document.createElement('div');row.className='row';row.innerHTML='<strong></strong><span></span>';row.querySelector('strong').textContent=strings.campaign;row.querySelector('span').textContent='Meta Ads';
        const budget=document.createElement('div');budget.className='card';budget.innerHTML='<b></b><p></p>';budget.querySelector('b').textContent=strings.paused;budget.querySelector('p').textContent=strings.budget;body.append(row,budget);button.textContent=strings.action;body.append(button,message);button.addEventListener('click',function(){message.textContent=strings.done;message.classList.add('show');});
      }else{
        const grid=document.createElement('div');grid.className='grid';
        [[strings.invoice,strings.debit,'$120.00'],[strings.inventory,strings.credit,'$120.00'],[strings.entry,strings.match,'$120.00']].forEach(function(item){const card=document.createElement('article');card.className='card';card.innerHTML='<b></b><p></p>';card.querySelector('b').textContent=item[0];card.querySelector('p').textContent=item[1]+' · '+item[2];grid.appendChild(card);});
        body.append(grid);button.textContent=strings.action;body.append(button,message);button.addEventListener('click',function(){message.textContent=strings.done;message.classList.add('show');});
      }
    })();
  </script>
</body>
</html>
