name: Plugin Curation Loop

# Weekly agent-run marketplace loop.
# Runs after the Connector Loop as part of the four Monday marketplace rounds.
# Required repo secrets:
#   Z_AI_API_KEY       API key de Z.ai (modelos GLM), que se le pasa a
#                      anthropics/claude-code-action@v1 por su entrada
#                      anthropic_api_key. NO es una key de Anthropic: el
#                      comentario anterior decía "Direct Claude API key" y
#                      mandó a más de uno a buscarla en console.anthropic.com.
#   LOOP_RUNS_WRITE_TOKEN    Shared bearer token accepted by /api/internal/loop-runs.
#   TS_CROSS_REPO_TOKEN      Optional PAT/app token, only needed for the rare app PR (see docs/integration-loop-two-pr-policy.md) in jmggaravito-sudo/terminal-sync.
#
# Required repo variables (Settings -> Secrets and variables -> Actions -> Variables):
#   ZAI_MODEL          Id exacto del modelo GLM que sirve esa key (el mismo
#                      valor que CANDIDATE_SUGGEST_MODEL en Vercel). No hay
#                      default posible: los ids de GLM cambian entre versiones
#                      y uno inventado falla recien al llamar al modelo.

on:
  schedule:
    # Monday 15:00 UTC / 10:00 Bogotá.
    - cron: "0 15 * * 1"
  workflow_dispatch:
    inputs:
      focus:
        description: "Optional product/plugin focus, e.g. gmail, shopify, seo"
        required: false
        type: string
      dry_run:
        description: "Investigate and report, but do not push/open PR/register run"
        required: false
        default: false
        type: boolean
      max_turns:
        description: "Tope de turnos del agente (vacio = 80). Bajalo a 15 o 20 para diagnosticar barato: la corrida de 81 turnos costo USD 7.73."
        required: false
        type: string

concurrency:
  group: plugin-curation-loop
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  run:
    name: Run Plugin Loop agent
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Dry-run preflight smoke
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
        env:
          ZAI_API_KEY: ${{ secrets.Z_AI_API_KEY }}
          LOOP_RUNS_ENDPOINT: https://terminalsync.ai/api/internal/loop-runs
          LOOP_RUNS_WRITE_TOKEN: ${{ secrets.LOOP_RUNS_WRITE_TOKEN }}
          TS_CROSS_REPO_TOKEN: ${{ secrets.TS_CROSS_REPO_TOKEN }}
          TERMINALSYNC_APP_REPO: jmggaravito-sudo/terminal-sync
        run: |
          set -euo pipefail
          test -n "$ZAI_API_KEY"
          test -n "$LOOP_RUNS_WRITE_TOKEN"
          test -n "$TS_CROSS_REPO_TOKEN"

          zai_code=$(curl -sS -o /tmp/zai-check.json -w '%{http_code}' \
            https://open.bigmodel.cn/api/paas/v4/models \
            -H "Authorization: Bearer $ZAI_API_KEY")
          test "$zai_code" = "200"
          echo 'Z.ai API: OK'

          loop_code=$(curl -sS -o /tmp/loop-runs-smoke.json -w '%{http_code}'             -X POST "$LOOP_RUNS_ENDPOINT"             -H "Authorization: Bearer $LOOP_RUNS_WRITE_TOKEN"             -H "Content-Type: application/json"             --data '{bad json')
          test "$loop_code" = "400"
          grep -q 'Invalid JSON' /tmp/loop-runs-smoke.json
          echo 'Loop run write token: OK'

          GH_TOKEN="$TS_CROSS_REPO_TOKEN" gh repo view "$TERMINALSYNC_APP_REPO" --json nameWithOwner >/tmp/app-repo.json
          echo 'Cross-repo token: OK'

      - name: Verificar credencial y modelo de Z.ai
        env:
          ZAI_API_KEY: ${{ secrets.Z_AI_API_KEY }}
          ZAI_MODEL: ${{ vars.ZAI_MODEL }}
        run: |
          set -euo pipefail
          missing=()
          [ -z "${ZAI_API_KEY:-}" ] && missing+=("el secret Z_AI_API_KEY")
          [ -z "${ZAI_MODEL:-}" ] && missing+=("la variable ZAI_MODEL")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Falta ${missing[*]}. El secret va en Settings -> Secrets and variables -> Actions -> Secrets; el id del modelo va en la pestana Variables, con el mismo valor que CANDIDATE_SUGGEST_MODEL en Vercel. Z.ai sirve modelos GLM, no Claude."
            exit 1
          fi
          echo "OK - key presente, modelo pedido: $ZAI_MODEL"

      - name: Run marketplace plugin curation loop
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != true }}
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOOP_RUNS_ENDPOINT: https://terminalsync.ai/api/internal/loop-runs
          LOOP_RUNS_WRITE_TOKEN: ${{ secrets.LOOP_RUNS_WRITE_TOKEN }}
          LOOP_FOCUS: ${{ inputs.focus }}
          LOOP_DRY_RUN: ${{ inputs.dry_run || 'false' }}
          TERMINALSYNC_APP_REPO: jmggaravito-sudo/terminal-sync
          TERMINALSYNC_APP_BASE_BRANCH: release/v0.2.18-lab
          TS_CROSS_REPO_TOKEN: ${{ secrets.TS_CROSS_REPO_TOKEN }}
          ANTHROPIC_BASE_URL: https://open.bigmodel.cn/api/anthropic
        with:
          anthropic_api_key: ${{ secrets.Z_AI_API_KEY }}
          base_branch: main
          branch_prefix: loop/plugins/
          prompt: |
            You are running TerminalSync's Plugin Curation Loop automatically.

            Goal: package existing marketplace pieces into product-level Plugins that pass the repo rules, then make the result visible in the existing ops panel.

            Read these files first and treat them as authoritative:
            - docs/plugin-curation-loop.md
            - content/plugins/RULES.md
            - content/connectors/SOURCES.md
            - content/skills/RULES.md
            - docs/integration-loop-two-pr-policy.md

            Current focus from workflow input: "${{ inputs.focus }}".
            Dry run: ${{ inputs.dry_run || 'false' }}.

            Work budget — read this before starting. The run is hard-capped at 80 turns and anything not pushed when the cap hits is lost: recent runs used all 80 turns and shipped nothing.
            - Read each listed doc once. Do not re-read files, browse git history or list the repo tree.
            - Ship at most 2 items. Choose them within your first 10 turns.
            - Logos: at most 2 attempts per item to get the official logo. If you cannot, use the TS fallback and record it in the "Logos pendientes" backlog of content/connectors/SOURCES.md. Never keep hunting.
            - As soon as the first item is complete and validated: commit, push the branch and open the draft PR (`gh pr create --draft`), then register the run right away (last operating rule). Only add a second item if you are clearly under 50 turns, and then update the PR body instead of registering again.
            - NEVER poll or wait for CI, workflow runs, evals or background processes (`gh run list`, `gh run watch`, `ps`, `sleep`, Monitor). Checks run on their own once the PR exists. Finish by printing the PR URL.

            Operating rules:
            1. Start from current main and create exactly one branch for this run.
            2. Use only official/repo-local evidence for factual content. GitHub/npm/official docs are acceptable where external verification is needed; aggregators are discovery hints only.
            3. Pick candidate product packs where an existing connector and/or public skill make one product easier for a business owner to install and use.
            4. Do not source new connector packages here. If a required connector or skill is missing, document it as SKIP/deferred for the Connector or Skill Loop.
            5. Write approved plugins in content/plugins/en and content/plugins/es using strict parity and content/plugins/RULES.md. The app-visible tagline/description/body must be localized in both languages; no Spanish fallback in `lang=en`.
            6. Source/create the plugin logo under public/plugins/<slug>.svg.
            7. If nothing is shippable, still update docs/plugin-curation-loop.md or content/plugins/RULES.md with a dated run note / blocker summary so the run is reviewable.
            8. Run validation before opening PRs: npm test -- --run src/lib/plugins.integrity.test.ts src/lib/plugins.test.ts src/lib/logoAssets.test.ts, plus npm run typecheck when feasible. If a full suite is unexpectedly blocked by unrelated environment issues, run the targeted tests you can and document the blocker in both PR bodies.
            9. Open exactly one landing/web draft PR in this repo. Never merge it.
            10. App PR: do NOT open one by default. Per docs/integration-loop-two-pr-policy.md the app consumes the catalog served by the landing PR. Open an app PR in $TERMINALSYNC_APP_REPO against $TERMINALSYNC_APP_BASE_BRANCH only if the item needs desktop code the app does not have (a special install flow, or an item that would render as a broken generic card); use TS_CROSS_REPO_TOKEN for it. Otherwise the landing PR body must say `App PR: no aplica — la app consume el catálogo`.
            11. If you did open an app PR, link both PRs in their bodies and include `## Lo que el bot de soporte debe saber` in the app PR body.
            12. After the landing/web draft PR exists and this is not a dry run, register the run history using scripts/record_loop_run.mjs with the actual counts and landing slugs:
                LOOP_RUNS_ENDPOINT="$LOOP_RUNS_ENDPOINT" LOOP_RUNS_WRITE_TOKEN="$LOOP_RUNS_WRITE_TOKEN" node scripts/record_loop_run.mjs --kind plugins --found <plugins_added_or_promoted> --skipped <candidates_skipped_or_deferred> --items <plugin_slugs_csv> --pr <landing_web_draft_pr_url>

            Expected final answer in the workflow log:
            - Landing/web PR URL
            - App PR URL, or `no aplica — la app consume el catálogo`
            - plugins added/promoted count
            - skipped/deferred count
            - landing plugin links visible in /admin/integraciones/loop-runs
            - where results are visible: /admin/integraciones/loop-runs
          claude_args: |
            --model ${{ vars.ZAI_MODEL }}
            --max-turns ${{ inputs.max_turns || '80' }}
            --allowedTools Read,Write,Edit,MultiEdit,Bash,WebFetch,Grep,Glob

      - name: Redactar el detalle de la corrida del agente
        # El JSON trae el transcripto completo del agente, y el prompt lo deja
        # correr comandos: si alguna vez corre `env`, el archivo queda con los
        # secretos en claro. GitHub enmascara los secrets en el LOG, no dentro
        # de un archivo que se sube como artifact. Paso exactamente eso en la
        # corrida 35742964885, que subio tokens de Actions legibles.
        #
        # Se redactan los valores que ESTE job inyecta, que son los unicos que
        # el agente puede leer, y despues se verifica de nuevo: si alguno
        # sobrevivio, el paso falla y no se sube nada. Falla cerrado a proposito
        # — es preferible quedarse sin diagnostico que publicar una credencial.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOOP_RUNS_WRITE_TOKEN: ${{ secrets.LOOP_RUNS_WRITE_TOKEN }}
          TS_CROSS_REPO_TOKEN: ${{ secrets.TS_CROSS_REPO_TOKEN }}
          ZAI_API_KEY: ${{ secrets.Z_AI_API_KEY }}
        run: |
          python3 - <<'PY'
          import os, pathlib, sys

          tmp = pathlib.Path(os.environ["RUNNER_TEMP"])
          src = tmp / "claude-execution-output.json"
          if not src.exists():
              print("No hay detalle de corrida que guardar.")
              sys.exit(0)

          nombres = ("GH_TOKEN", "LOOP_RUNS_WRITE_TOKEN", "TS_CROSS_REPO_TOKEN", "ZAI_API_KEY")
          # El corte de 8 evita que un valor corto o vacio redacte medio archivo.
          secretos = [v for v in (os.environ.get(n, "").strip() for n in nombres) if len(v) >= 8]

          datos = src.read_text(encoding="utf-8", errors="surrogateescape")
          for s in secretos:
              datos = datos.replace(s, "***REDACTADO***")

          quedaron = [n for n, v in zip(nombres, (os.environ.get(n, "").strip() for n in nombres)) if len(v) >= 8 and v in datos]
          if quedaron:
              print("::error::Quedaron secretos sin redactar en el detalle de la corrida (%s). No se sube nada." % ", ".join(quedaron))
              sys.exit(1)

          destino = tmp / "claude-execution-output.redacted.json"
          destino.write_text(datos, encoding="utf-8", errors="surrogateescape")
          print("Detalle redactado: %d valores cubiertos, %d bytes." % (len(secretos), len(datos)))
          PY

      - name: Guardar el detalle redactado de la corrida del agente
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-execution-output
          path: ${{ runner.temp }}/claude-execution-output.redacted.json
          retention-days: 7
          if-no-files-found: warn
