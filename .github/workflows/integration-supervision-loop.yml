name: Integration Supervision Loop

on:
  workflow_dispatch:
  schedule:
    # Tuesday 14:00 UTC / 09:00 Bogotá, after the four Monday marketplace loops.
    - cron: "0 14 * * 2"
  pull_request:
    paths:
      - "content/connectors/**"
      - "content/plugins/**"
      - "content/kits/**"
      - "content/skills/**"
      - "public/connectors/**"
      - "public/plugins/**"
      - "public/skills/**"
      - "public/logos/**"
      - "src/app/api/marketplace/catalog/**"
      - "src/lib/marketplace/**"
      - "src/lib/plugins*"
      - "src/lib/skills*"
      - ".github/workflows/integration-supervision-loop.yml"
      - "docs/integration-supervision-loop.md"

permissions:
  contents: read

jobs:
  supervise:
    name: Supervise marketplace → app integration UX
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run integration supervision checks
        run: |
          npm test -- --run \
            src/app/api/marketplace/catalog/route.test.ts \
            src/lib/marketplace/kitsIntegrity.test.ts \
            src/lib/plugins.integrity.test.ts \
            src/lib/plugins.test.ts \
            src/lib/skills.test.ts \
            src/lib/logoAssets.test.ts
